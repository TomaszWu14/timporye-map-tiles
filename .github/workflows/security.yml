name: Security

# Skan sekretów (wspólna podstawa bezpieczeństwa, wzór: container-queue `security.yml`, job `secrets-sast`):
#  - PR do main: gitleaks TYLKO na commitach PR-a,
#  - push do main, co tydzień i ręcznie: gitleaks na CAŁEJ historii.
# Fałszywy alarm: fingerprint w `.gitleaksignore` (z komentarzem dlaczego) albo `gitleaks:allow` w linii.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"   # poniedziałek 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Skan sekretów (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # gitleaks czyta commity (base..head PR-a albo całą historię)
          persist-credentials: false
      - name: Instalacja gitleaks (przypięta wersja + sha256)
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: gitleaks
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          args=(git --redact --no-banner)
          # PR: tylko jego commity; push/cron/ręcznie: cała historia.
          if [ -n "$BASE" ]; then args+=(--log-opts="$BASE..$HEAD"); fi
          "$RUNNER_TEMP/gitleaks" "${args[@]}" .
