# Dependabot: cotygodniowe aktualizacje akcji GitHub (przypiętych do SHA) w .github/workflows.
# Repo nie ma plików zależności pip/npm ani Dockerfile — tylko ekosystem github-actions.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
